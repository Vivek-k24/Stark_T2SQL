name: Temporary manual-cleanup regression check
on:
  push:
    branches: [cleanup/remove-agent-automation]
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STARK_TEST_ENABLE_DB_INTEGRATION: "0"
      PYTHONPATH: "src:."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -e '.[dev]' 'Faker==40.43.0' 'streamlit==1.66.0'
      - name: Focused manual UI and regression tests
        run: python -m pytest tests/test_interim_ui.py tests/test_trace_ui_contracts.py -q -ra
      - name: Full offline regression suite
        run: python -m pytest -q -ra
