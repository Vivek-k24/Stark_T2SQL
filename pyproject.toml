[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stark-t2sql"
version = "0.1.0"
description = "STARK T2SQL defense-in-depth local Text-to-SQL reference system"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "sqlglot>=25.0",
    "psycopg2-binary>=2.9",
    "streamlit>=1.30",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "Faker>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "r01_acceptance: requires the actual owner-approved template contract and authoritative local template bytes",
]
